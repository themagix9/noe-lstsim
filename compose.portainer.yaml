services:
  noe-lstsim:
    image: ghcr.io/themagix9/noe-lstsim:${IMAGE_TAG:-latest}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-8088}:8080"
    volumes:
      - simulation-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Tunnel-Token in Portainer hinterlegen}
    depends_on:
      noe-lstsim:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  simulation-data:
