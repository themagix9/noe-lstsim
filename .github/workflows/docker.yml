name: Test and publish Docker image
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test simulation and HTTP API
        run: python -m unittest discover -s tests -v
      - name: Check frontend syntax
        run: |
          node --check app/static/app.js
          node --check app/static/live-ui.js
          node --check app/static/window-ui.js
          node --check app/static/dispatch-layout.js
          node --check app/static/resource-icons.js
          node --check app/static/workspace-ui.js
          node tests/test_live_ui.js
          node --check app/static/transport-reminders.js
          node tests/test_transport_reminders.js
      - name: Install browser test dependencies
        run: |
          pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
      - name: Test multiplayer in two browser sessions
        run: python tests/browser_smoke.py
      - name: Test road routing, ETA and map icons
        run: python tests/browser_routing.py
      - name: Test live editing, empty code choices, resource filters and sorting
        run: python tests/browser_live.py
      - name: Test touch selection, movable window and emergency caller dialogue
        run: python tests/browser_calls.py
      - name: Test Calltaker and dispatcher handoff in separate browser sessions
        run: python tests/browser_split.py
      - name: Upload internal UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-preview
          path: /tmp/noe-ui-qa/*.png
          if-no-files-found: ignore
      - name: Validate Portainer stack
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ci-validation-placeholder
        run: |
          docker compose -f compose.portainer.yaml config --quiet
          docker compose -f compose.portainer.yaml -f compose.routing.yaml config --quiet
      - name: Build Docker image
        run: docker build -t noe-lstsim:test .
      - name: Verify container startup and health
        run: |
          docker run -d --name smoke -p 127.0.0.1:18080:8080 noe-lstsim:test
          trap 'docker logs smoke; docker rm -f smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/api/health; then
              curl --fail --silent http://127.0.0.1:18080/ | python -c 'import sys; assert "NÖ Dispo" in sys.stdin.read()'
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Publish to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ghcr.io/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker tag noe-lstsim:test "$IMAGE:latest"
          docker tag noe-lstsim:test "$IMAGE:sha-$REVISION"
          docker push "$IMAGE:sha-$REVISION"
          docker push "$IMAGE:latest"
