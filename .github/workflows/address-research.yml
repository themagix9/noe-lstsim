name: Refresh Dispo 05 address research
on:
  push:
    paths:
      - scripts/import_zone5_addresses.py
      - .github/workflows/address-research.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  addresses:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/import_zone5_addresses.py /tmp/zone5-addresses.json
      - uses: actions/upload-artifact@v4
        with:
          name: zone5-addresses
          path: /tmp/zone5-addresses.json
