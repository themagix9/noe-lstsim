services:
  noe-dispo:
    build: .
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      ROUTING_URL: ${ROUTING_URL:-https://routing.openstreetmap.de/routed-car}
      ROUTING_BACKUP_URL: ${ROUTING_BACKUP_URL:-https://router.project-osrm.org}
      ROUTING_ENABLED: ${ROUTING_ENABLED:-1}
    volumes:
      - simulation-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  simulation-data:
