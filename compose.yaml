services:
  noe-dispo:
    build: .
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      ROUTING_URL: ${ROUTING_URL:-http://osrm:5000}
      ROUTING_BACKUP_URL: ${ROUTING_BACKUP_URL:-https://router.project-osrm.org}
      ROUTING_ENABLED: ${ROUTING_ENABLED:-1}
    depends_on:
      osrm:
        condition: service_started
    volumes:
      - simulation-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  osm-download:
    image: curlimages/curl:latest
    user: "0:0"
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        if [ ! -s /data/austria.osm.pbf ]; then
          curl --fail --location --retry 4 https://download.geofabrik.de/europe/austria-latest.osm.pbf --output /data/austria.osm.pbf.partial
          mv /data/austria.osm.pbf.partial /data/austria.osm.pbf
        fi
    volumes:
      - routing-data:/data
    restart: "no"

  osm-prepare:
    image: ${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend:latest}
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        # BEGIN embedded NOe car profile
        cat > /data/noe-car.lua <<'NOE_CAR_PROFILE'
        -- Simulator profile: base speeds, not live traffic or emergency-driving advice.
        -- Extend the car profile shipped with the selected OSRM image.
        package.path = '/opt/?.lua;' .. package.path
        local car = dofile('/opt/car.lua')
        local original_setup = car.setup
        local original_way = car.process_way
        car.setup = function()
          local p = original_setup()
          local speeds = p.speeds.highway or p.speeds
          speeds.motorway = 130
          speeds.trunk = 100
          speeds.primary = 50
          speeds.secondary = 50
          speeds.tertiary = 50
          speeds.unclassified = 50
          speeds.residential = 50
          -- Ramps, service roads, surfaces, turn/access restrictions stay in car.lua.
          p.speed_reduction = 1.0
          p.maxspeed_table_default.urban = 50
          p.maxspeed_table_default.rural = 100
          p.maxspeed_table_default.trunk = 100
          p.maxspeed_table_default.motorway = 130
          p.maxspeed_table['at:urban'] = 50
          p.maxspeed_table['at:rural'] = 100
          p.maxspeed_table['at:trunk'] = 100
          p.maxspeed_table['at:motorway'] = 130
          return p
        end
        car.process_way = function(profile, way, result, relations)
          original_way(profile, way, result, relations)
          local highway = way:get_value_by_key('highway') or ''
          local ref = way:get_value_by_key('ref') or ''
          -- Austrian S-roads can be mapped as highway=motorway as well as trunk.
          local expressway = ref:match('^S%s*%d') or ref:match(';%s*S%s*%d')
          local cap = highway == 'motorway' and (expressway and 100 or 130)
                   or highway == 'trunk' and 100 or nil
          if cap then
            for _, direction in ipairs({'forward', 'backward'}) do
              local speed_key, rate_key = direction .. '_speed', direction .. '_rate'
              local speed = result[speed_key]
              if speed and speed > cap then
                if result[rate_key] and result[rate_key] > 0 then
                  result[rate_key] = result[rate_key] * cap / speed
                end
                result[speed_key] = cap
              end
            end
          end
        end
        return car
        NOE_CAR_PROFILE
        # END embedded NOe car profile
        version="$$(osrm-routed --version):$$(sha256sum /data/noe-car.lua | cut -d' ' -f1)"
        if [ ! -f /data/ready ] || [ "$$(cat /data/ready)" != "$$version" ]; then
          osrm-extract -p /data/noe-car.lua /data/austria.osm.pbf
          osrm-partition /data/austria.osrm
          osrm-customize /data/austria.osrm
          printf '%s' "$$version" > /data/ready
        fi
    depends_on:
      osm-download:
        condition: service_completed_successfully
    volumes:
      - routing-data:/data
    restart: "no"

  osrm:
    image: ${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend:latest}
    command: osrm-routed --algorithm mld --max-table-size 100 /data/austria.osrm
    depends_on:
      osm-prepare:
        condition: service_completed_successfully
    volumes:
      - routing-data:/data:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  simulation-data:
  routing-data:
