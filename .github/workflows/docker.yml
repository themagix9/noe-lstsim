name: Test and publish Docker image
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test simulation and HTTP API
        run: python -m unittest discover -s tests -v
      - name: Check frontend syntax
        run: node --check app/static/app.js
      - name: Build Docker image
        run: docker build -t noe-lstsim:test .
      - name: Verify container startup and health
        run: |
          docker run -d --name smoke -p 127.0.0.1:18080:8080 noe-lstsim:test
          trap 'docker logs smoke; docker rm -f smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/api/health; then
              curl --fail --silent http://127.0.0.1:18080/api/state | python -c 'import json,sys; assert len(json.load(sys.stdin)["vehicles"]) == 14'
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Publish to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ghcr.io/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker tag noe-lstsim:test "$IMAGE:latest"
          docker tag noe-lstsim:test "$IMAGE:sha-$REVISION"
          docker push "$IMAGE:sha-$REVISION"
          docker push "$IMAGE:latest"
